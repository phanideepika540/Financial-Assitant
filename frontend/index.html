<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A thoughtful space to learn about personal finance, investing, and your financial goals."
    />
    <meta name="theme-color" content="#f6f5f0" />
    <script>
      // Apply the saved/OS theme before first paint to avoid a light flash.
      try {
        var t = localStorage.getItem("finch-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Finance, made clearer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
